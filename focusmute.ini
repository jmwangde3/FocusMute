# FocusMute configuration
#
# process = executable name(s) to watch, comma separated, case does not matter.
#           Several entries are fine: each app is judged on its own.
# mute    = mute a target's own audio session while it is in the background (true/false)
# pause   = also suspend the target process while it is in the background (true/false)
#           Only for games that do NOT pause themselves - suspending a game that is
#           writing a save file or talking to a server can freeze it or disconnect it.
# poll_ms = how often the focused window is checked (milliseconds)

[general]
process = YourGame.exe
mute = true
pause = false
poll_ms = 250

# Per-app overrides: add a [target:<exe name>] section and only the keys you change.
#
# [target:SomeGame.exe]
# pause = true
#
# [target:AnotherGame.exe]
# mute = false
